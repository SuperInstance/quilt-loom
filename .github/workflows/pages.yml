name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment: { name: github-pages }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install --no-save yaml || true
      - run: node run_offline.mjs
      - run: node build_playground.mjs || true
      - name: stage site
        run: |
          mkdir -p _site
          cp outputs/playground.html _site/index.html || cp playground_template.html _site/index.html
          cp -r outputs/charts _site/charts 2>/dev/null || true
          cp README.md _site/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - uses: actions/deploy-pages@v4
